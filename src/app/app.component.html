<div #scrollContainer class="container" [class.refreshing]="isRefreshing()">
<div
    class="pull-refresh-indicator"
    [style.transform]="'translateX(-50%) translateY(' + (pullDistance() - 60) + 'px)'"
    [class.active]="pullActive()"
  >
  <div class="refresh-icon" [class.refreshing]="isRefreshing()">
    <svg width="40" height="40" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="16" fill="none" stroke="#FFD70033" stroke-width="3"/>
      <circle cx="20" cy="20" r="16" fill="none" stroke="#FFD700" stroke-width="3"
        stroke-linecap="round"
        stroke-dasharray="40 60"
        stroke-dashoffset="0"/>
    </svg>
  </div>
</div>

  <header>
    <h2>
      🥊 <span class="session-title">{{ title }} {{ sessionTitle() }}</span> 🥊
    </h2>
  </header>

  <main>
    <div class="rounds-container">
      @for (challenge of challenges(); track $index) {
        <div class="round-card">
          <h2>{{ challenge.round }} - {{ challenge.title | lowercase }}</h2>
          <div class="sequence">
            @for (round of challenge.sequence; track $index) {
              <div class="round-item">
                <span class="round-name">{{ round.move }}</span>
                <span class="timing" [class.double-timing]="round.timing === 2">
                  {{ round.timing === 1 ? "+" : "++" }}
                </span>
              </div>
            }
          </div>
        </div>
      }
    </div>
  </main>
</div>
