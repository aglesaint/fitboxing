<div #scrollContainer class="container" [class.refreshing]="isRefreshing()">

  <!-- Pull-to-refresh indicator simplifié -->
  <div
    class="pull-refresh-indicator"
    [style.transform]="'translateX(-50%) translateY(' + (pullDistance() - 60) + 'px)'"
    [class.active]="pullActive()"
  >
    <div class="refresh-icon" [class.refreshing]="isRefreshing()">
      <!-- SVG flèche noire sur fond jaune -->
      <svg width="40" height="40" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" fill="#FFD700" />
        <path d="M12 6v6l4 2" stroke="#000" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

  <header>
    <h2>
      🥊 <span class="session-title">{{ title }} {{ sessionTitle() }}</span> 🥊
    </h2>
  </header>

  <main>
    <div class="rounds-container">
      @for (challenge of challenges(); track $index; let i = $index) {
        <div class="round-card">
          <h2>{{ challenge.round }} - {{ challenge.title | lowercase }}</h2>
      
          <div class="sequence">
            @for (round of challenge.sequence; track $index; let j = $index) {
              <div class="round-item">
                <span class="round-name">
                  {{ round.move }}
                </span>
      
                <span class="timing" [class.double-timing]="round.timing === 2">
                  {{ round.timing === 1 ? '+' : '++' }}
                </span>
              </div>
            }
          </div>
        </div>
      }
    </div>
  </main>
</div>
